name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: swift test (conformance gate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      # Runs LoveLetterCoreTests (incl. the golden-fixture ConformanceTests that
      # pin the cross-platform wire format) and LoveLetterUITests.
      - name: Run tests
        run: swift test

  fixtures-in-sync:
    name: fixtures match loveletter-spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The conformance gate only means something if the vendored golden fixtures
      # still match the canonical ones in loveletter-spec. Fail loudly on drift.
      - name: Diff vendored fixtures against the canonical spec
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/hayek/loveletter-spec/main/fixtures
          dir=Tests/LoveLetterCoreTests/Fixtures/conformance
          for f in format-cases.json parse-cases.json; do
            curl -fsSL "$base/$f" -o "/tmp/$f"
            if ! diff -u "/tmp/$f" "$dir/$f"; then
              echo "::error::$f drifted from loveletter-spec — re-run the spec's sync-to-swift.sh and commit."
              exit 1
            fi
          done
          echo "Vendored fixtures are in sync with loveletter-spec."
